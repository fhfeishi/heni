name: heni
description: A local audio and video player with beautiful scenery-driven playback.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.2
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  media_kit: ^1.2.0
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^1.3.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
