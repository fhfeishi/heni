[package]
name = "heni-native-audio-spike"
version = "0.1.0"
description = "Throwaway evidence harness for the Heni native audio decision"
edition = "2021"
publish = false

[dependencies]
cpal = "=0.18.2"
ringbuf = "=0.4.8"
rubato = "=5.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
symphonia = { version = "=0.6.1", features = ["all"] }
symphonia-adapter-libopus = { version = "=0.3.0", features = ["bundled"] }
