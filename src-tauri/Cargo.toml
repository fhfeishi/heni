[package]
name = "heni-desktop"
version = "0.1.0"
description = "Heni Windows-first local media player"
authors = ["Heni contributors"]
edition = "2021"

[lib]
name = "heni_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
cpal = "=0.18.2"
fastrand = "=2.5.0"
getrandom = "=0.3.4"
tiny_http = "=0.12.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
ringbuf = "=0.4.8"
rubato = "=5.0.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
symphonia = { version = "=0.6.1", features = ["all"] }
symphonia-adapter-libopus = { version = "=0.3.0", features = ["bundled"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-fs = "=2.5.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common"] }
